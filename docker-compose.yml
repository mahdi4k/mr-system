version: "3.9"

services:
  mantine-next-template:
    build:
      context: . # Path to your Dockerfile directory
      dockerfile: Dockerfile
    ports:
      - "3000:3000" # Map port 3000 of the container to port 3000 on the host
    environment:
      NODE_ENV: production
    volumes:
      - .:/app # Optional: For local development to sync code changes
      - /app/node_modules # Prevent syncing `node_modules` with local
    restart: unless-stopped
